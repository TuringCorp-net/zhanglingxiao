name = "findora-api"
main = "src/api/index.ts"
compatibility_date = "2024-12-05"

[site]
bucket = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "findora-staging"
database_id = "staging-placeholder"

# AI provider configuration (F-020, F-021)
# Set via `wrangler secret put AI_API_KEY` for production
[vars]
AI_PROVIDER = "openai"

[env.production]
[[d1_databases]]
binding = "DB"
database_name = "findora-production"
database_id = "production-placeholder"

# AI provider configuration for production
[env.production.vars]
AI_PROVIDER = "openai"
