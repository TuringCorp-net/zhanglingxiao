name = "findora_api"
main = "src/api/index.ts"
compatibility_date = "2024-12-05"

routes = [
  { pattern = "findora.turingcorp.net", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "findora_db"
database_id = "67e67029-725a-499f-b4d6-f2969a3f8073"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRODUCTS_BUCKET"
bucket_name = "findora-products"

[assets]
directory = "src/pages"

[vars]
# AI_PROVIDER and ADMIN_KEY are managed via Cloudflare Dashboard Secrets

[triggers]
crons = ["0 9 * * 4"]

[observability]
[observability.logs]
enabled = true
invocation_logs = true
