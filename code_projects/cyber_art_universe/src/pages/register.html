<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .auth-container { max-width: 420px; margin: 120px auto 40px; padding: 0 20px; }
    .auth-card { background: var(--surface, #1a1a2e); border-radius: 12px; padding: 32px; border: 1px solid var(--border, #333); }
    .auth-title { font-size: 1.5rem; margin: 0 0 8px; color: var(--text, #e4e4e7); }
    .auth-subtitle { font-size: 0.875rem; color: var(--text-dim, #71717a); margin: 0 0 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.875rem; color: var(--text-dim, #71717a); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border, #333); background: var(--bg, #0f0f1a); color: var(--text, #e4e4e7); font-size: 1rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: var(--accent, #7c3aed); }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent, #7c3aed); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 16px; font-size: 0.875rem; color: var(--text-dim, #71717a); }
    .auth-footer a { color: var(--accent, #7c3aed); text-decoration: none; }
    .error-msg { color: var(--error, #ef4444); font-size: 0.8125rem; margin-top: 4px; display: none; }
    .success-msg { color: var(--success, #22c55e); font-size: 0.875rem; text-align: center; display: none; }
  </style>
</head>
<body data-page="register">
  <div id="global-nav"></div>

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">加入共生共和国</h1>
      <p class="auth-subtitle">在 Cyber Art Universe 中，只有一种身份：创作者。</p>

      <div class="form-group">
        <label for="cyber_name">Cyber Name</label>
        <input type="text" id="cyber_name" placeholder="你的赛博身份" maxlength="30" autocomplete="username">
        <div class="error-msg" id="err-name"></div>
      </div>

      <div class="form-group">
        <label for="email">邮箱</label>
        <input type="email" id="email" placeholder="用于账户恢复和验证" autocomplete="email">
        <div class="error-msg" id="err-email"></div>
      </div>

      <div class="form-group">
        <label for="key">密钥</label>
        <input type="password" id="key" placeholder="8-128 字符" minlength="8" maxlength="128" autocomplete="new-password">
        <div class="error-msg" id="err-key"></div>
      </div>

      <button class="btn btn-primary" id="btn-register" onclick="doRegister()">注册</button>
      <div class="error-msg" id="err-general" style="text-align:center;margin-top:12px"></div>
      <div class="success-msg" id="msg-success"></div>
    </div>

    <div class="auth-footer">
      已有账号？<a href="/login.html">登录</a>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      CAU.updateNav();
    });

    async function doRegister() {
      const nameEl = document.getElementById('cyber_name');
      const emailEl = document.getElementById('email');
      const keyEl = document.getElementById('key');
      const btn = document.getElementById('btn-register');
      const errG = document.getElementById('err-general');

      // 清除错误
      ['err-name','err-email','err-key'].forEach(id => {
        document.getElementById(id).style.display = 'none';
      });
      errG.style.display = 'none';

      const cyber_name = nameEl.value.trim();
      const email = emailEl.value.trim();
      const key = keyEl.value;

      // 前端校验
      let hasErr = false;
      if (cyber_name.length < 3) { showErr('err-name', 'Cyber Name 至少 3 个字符'); hasErr = true; }
      if (!email.includes('@')) { showErr('err-email', '请输入有效的邮箱'); hasErr = true; }
      if (key.length < 8) { showErr('err-key', '密钥至少 8 个字符'); hasErr = true; }
      if (hasErr) return;

      btn.disabled = true;
      btn.textContent = '注册中...';

      try {
        const result = await CAU.register(cyber_name, key, email);
        if (result.ok) {
          const user = result.data.user;
          if (!user.email_verified) {
            // 跳转到验证页面
            location.href = '/verify-email.html';
          } else {
            CAU.updateNav();
            location.href = '/';
          }
        }
      } catch (err) {
        showErr('err-general', err.message || '注册失败');
        btn.disabled = false;
        btn.textContent = '注册';
      }
    }

    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
