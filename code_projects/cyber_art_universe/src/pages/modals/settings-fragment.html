<!-- Settings Modal Template — 由 auth.js 加载并注入用户数据 -->
<div class="modal-card">
  <h2 data-i18n="settings.heading">Settings</h2>

  <div id="ms-loading" class="sub" data-i18n="settings.loading">Loading...</div>

  <div id="ms-content" style="display:none">
    <!-- 状态统计 -->
    <div class="stat-row">
      <div class="stat-item">
        <div class="stat-val" id="ms-cyber-name">—</div>
        <div class="stat-lbl" data-i18n="settings.cyber_name">Cyber Name</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="ms-class">—</div>
        <div class="stat-lbl" data-i18n="settings.class_label">Class</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="ms-karma">✦ 0</div>
        <div class="stat-lbl" data-i18n="settings.karma">Karma</div>
      </div>
      <div class="stat-item">
        <div class="stat-val" id="ms-energy">⚡ ?/?</div>
        <div class="stat-lbl" data-i18n="settings.energy">Energy</div>
      </div>
    </div>

    <div id="ms-verify-warn" style="display:none">
      <p style="color:var(--warn,#f59e0b);font-size:0.75rem;margin:0 0 12px"><span data-i18n="settings.email_not_verified">⚠️ Email not verified.</span> <a href="/verify-email.html" style="color:var(--accent)" data-i18n="settings.verify_now">Verify now</a></p>
    </div>

    <!-- 当前邮箱（只读） -->
    <div class="field">
      <label data-i18n="settings.email_label">Email</label>
      <input id="ms-email-display" value="" disabled style="opacity:0.6">
    </div>

    <!-- 修改 Cyber Name -->
    <div class="field">
      <label for="ms-new-name" data-i18n="settings.new_cyber_name_label">New Cyber Name (leave blank to keep current)</label>
      <input id="ms-new-name" data-i18n-placeholder="settings.cyber_name_placeholder" placeholder="3–30 characters" maxlength="30">
    </div>
    <button class="btn btn-pri" id="ms-btn-name" data-i18n="settings.change_cyber_name_btn">Change Cyber Name</button>
    <div class="msg msg-err" id="ms-err-name"></div>
    <div class="msg msg-ok" id="ms-ok-name"></div>

    <!-- 登出 -->
    <button class="btn btn-danger" id="ms-btn-logout" data-i18n="settings.logout_btn">Log out</button>
  </div>
</div>
