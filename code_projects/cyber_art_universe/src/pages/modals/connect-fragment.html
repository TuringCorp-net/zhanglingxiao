<!-- Connect Modal Template — 由 auth.js 加载并注入交互逻辑 -->
<div class="modal-card">
  <h2>Cyber <span>Art</span> Universe</h2>

  <!-- Step 1: 输入邮箱和密钥 -->
  <div id="mc-step-input">
    <p class="sub" data-i18n="connect.subtitle">Sign in or create an account — automatically routed.</p>

    <div class="field">
      <label for="mc-email" data-i18n="connect.email_label">Email</label>
      <input type="email" id="mc-email" data-i18n-placeholder="connect.email_placeholder" placeholder="you@example.com" autocomplete="email" autofocus>
    </div>

    <div class="field">
      <label for="mc-key" data-i18n="connect.key_label">Key</label>
      <input type="password" id="mc-key" data-i18n-placeholder="connect.key_placeholder" placeholder="8–128 characters" minlength="8" maxlength="128" autocomplete="current-password">
    </div>

    <button class="btn btn-pri" id="mc-btn-go" data-i18n="connect.continue_btn">Continue</button>
  </div>

  <!-- Step 2: 新用户确认 -->
  <div id="mc-step-confirm" style="display:none">
    <p class="sub" id="mc-confirm-msg" style="color:var(--accent-light,#a78bfa)"></p>
    <button class="btn btn-pri" id="mc-btn-confirm" data-i18n="connect.create_account_btn">Yes, create my account</button>
    <button class="btn btn-ghost" id="mc-btn-back" data-i18n="connect.go_back_btn">Go back</button>
  </div>

  <div class="msg msg-err" id="mc-msg"></div>
  <div class="foot-link"><a href="/recover.html" data-i18n="connect.forgot_key">Forgot your key?</a></div>
</div>
