<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .auth-container { max-width: 420px; margin: 120px auto 40px; padding: 0 20px; }
    .auth-card { background: var(--surface, #1a1a2e); border-radius: 12px; padding: 32px; border: 1px solid var(--border, #333); }
    .auth-title { font-size: 1.5rem; margin: 0 0 8px; color: var(--text, #e4e4e7); }
    .auth-subtitle { font-size: 0.875rem; color: var(--text-dim, #71717a); margin: 0 0 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.875rem; color: var(--text-dim, #71717a); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border, #333); background: var(--bg, #0f0f1a); color: var(--text, #e4e4e7); font-size: 1rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: var(--accent, #7c3aed); }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent, #7c3aed); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 16px; font-size: 0.875rem; color: var(--text-dim, #71717a); }
    .auth-footer a { color: var(--accent, #7c3aed); text-decoration: none; }
    .error-msg { color: var(--error, #ef4444); font-size: 0.875rem; text-align: center; margin-top: 12px; display: none; }
  </style>
</head>
<body data-page="login">
  <div id="global-nav"></div>

  <div class="auth-container">
    <div class="auth-card">
      <h1 class="auth-title">欢迎回来</h1>
      <p class="auth-subtitle">用你的 Cyber Name 登录，继续在文学宇宙中探索。</p>

      <div class="form-group">
        <label for="cyber_name">Cyber Name</label>
        <input type="text" id="cyber_name" placeholder="你的赛博身份" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="key">密钥</label>
        <input type="password" id="key" placeholder="你的密钥" autocomplete="current-password">
      </div>

      <button class="btn btn-primary" id="btn-login" onclick="doLogin()">登录</button>
      <div class="error-msg" id="err-general"></div>
    </div>

    <div class="auth-footer">
      没有账号？<a href="/register.html">注册</a><br>
      <a href="/recover.html" style="font-size:0.8125rem">忘记密钥？</a>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      CAU.updateLoginButton();
    });

    async function doLogin() {
      const cyber_name = document.getElementById('cyber_name').value.trim();
      const key = document.getElementById('key').value;
      const btn = document.getElementById('btn-login');
      const errG = document.getElementById('err-general');

      errG.style.display = 'none';

      if (!cyber_name || !key) {
        showErr('请输入 Cyber Name 和密钥');
        return;
      }

      btn.disabled = true;
      btn.textContent = '登录中...';

      try {
        const result = await CAU.login(cyber_name, key);
        if (result.ok) {
          CAU.updateLoginButton();
          location.href = '/';
        }
      } catch (err) {
        showErr(err.message || '登录失败');
        btn.disabled = false;
        btn.textContent = '登录';
      }
    }

    function showErr(msg) {
      const el = document.getElementById('err-general');
      el.textContent = msg;
      el.style.display = 'block';
    }
  </script>
</body>
</html>
