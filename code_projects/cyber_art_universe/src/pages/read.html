<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>阅读 — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/story-elf.css">
</head>
<body data-page="read">
  <!-- 轻量面包屑导航（无 Read/Write 标签，沉浸式阅读体验） -->
  <div class="read-header">
    <div class="container">
      <div class="read-brand-wrap">
        <a href="/" class="nav-brand">Cyber <span>Art</span> Universe</a>
        <span class="read-breadcrumb">› <span id="bc-work">加载中...</span> › <span id="bc-section">加载中...</span></span>
      </div>
      <div class="font-controls">
        <button onclick="setFontSize('small')" title="小">A-</button>
        <button class="active" onclick="setFontSize('normal')" title="中">A</button>
        <button onclick="setFontSize('large')" title="大">A+</button>
      </div>
    </div>
  </div>

  <!-- 两栏布局：左 章节列表+Elf / 右 章节正文 -->
  <div id="split-view" class="split-view">
    <div class="split-left" id="split-left">
      <div class="left-upper" id="left-upper">
        <div class="left-panel-empty"></div>
      </div>
      <div class="left-hdivider" id="left-hdivider" style="display:none"></div>
      <div class="left-lower" id="left-lower"></div>
    </div>
    <div class="split-divider" id="split-divider-1"></div>
    <div class="split-mid" id="split-mid">
      <div id="mid-content" class="read-content"><div class="loading">加载中...</div></div>
      <div class="chapter-nav" id="chapter-nav"></div>
      <div class="chapter-info" id="chapter-info"></div>
    </div>
    <div class="split-divider" id="split-divider-2" style="display:none"></div>
    <div class="split-right" style="display:none"></div>
  </div>

  <footer class="footer">
    <div class="container">
      <span>Powered by <a href="https://turingcorp.net">TuringCorp.net</a>. All rights reserved. <a href="#" onclick="alert('Terms of Use 即将上线');return false">Terms of Use</a></span>
      <a href="/.well-known/agent-manifest.json">Agent Entry</a>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
  <script src="/i18n-data.js"></script>
  <script src="/story-elf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    initPage();
    var workId = getParam('work');
    var sectionId = getParam('section');
    var LAST_READ_KEY = 'sf_last_read';

    // 跨章节切换的缓存数据（只加载一次）
    var _workTitle = '';
    var _sections = [];

    function getLastRead(wid) {
      try {
        var data = JSON.parse(localStorage.getItem(LAST_READ_KEY) || '{}');
        return data[wid] || null;
      } catch (e) { return null; }
    }

    function setLastRead(wid, sid) {
      try {
        var data = JSON.parse(localStorage.getItem(LAST_READ_KEY) || '{}');
        data[wid] = sid;
        localStorage.setItem(LAST_READ_KEY, JSON.stringify(data));
      } catch (e) {}
    }

    function setFontSize(size) {
      var sizes = { small: '15px', normal: '16px', large: '18px' };
      document.querySelector('.read-content').style.setProperty('--read-size', sizes[size]);
      document.querySelectorAll('.font-controls button').forEach(function (b) { b.classList.remove('active'); });
      document.querySelector('.font-controls button[onclick="setFontSize(\'' + size + '\')"]').classList.add('active');
    }

    // ---- 客户端章节导航（不刷新页面） ----

    function renderLeftPanel(activeSectionId) {
      var leftUpper = document.getElementById('left-upper');
      if (!_sections.length) {
        leftUpper.innerHTML = '<div class="left-panel-empty">暂无章节</div>';
        return;
      }
      leftUpper.innerHTML = '<div class="card-list" style="padding:0.5rem 0">'
        + _sections.map(function (s) {
          var isActive = s.id === activeSectionId ? ' active' : '';
          return '<div class="card-item' + isActive + '" style="width:100%;cursor:pointer"'
            + ' onclick="loadChapter(\'' + s.id + '\')">'
            + '<span class="card-item-name">' + escHtml(s.title) + '</span>'
            + '<span class="card-item-meta">' + (s.word_count || 0) + '字</span>'
            + '</div>';
        }).join('')
        + '</div>';
    }

    function renderPrevNext(sections, activeId) {
      var nav = document.getElementById('chapter-nav');
      var idx = sections.findIndex(function (s) { return s.id === activeId; });
      var html = '';
      if (idx > 0) {
        html += '<a href="javascript:void(0)" onclick="loadChapter(\'' + sections[idx-1].id + '\')" class="btn btn-ghost">← ' + escHtml(sections[idx-1].title) + '</a>';
      } else { html += '<span></span>'; }
      if (idx < sections.length - 1) {
        html += '<a href="javascript:void(0)" onclick="loadChapter(\'' + sections[idx+1].id + '\')" class="btn btn-ghost">' + escHtml(sections[idx+1].title) + ' →</a>';
      } else { html += '<span></span>'; }
      nav.innerHTML = html;
    }

    async function loadChapter(sid, replaceState) {
      if (!sid) return;

      // 更新 URL（不刷新页面）
      var newUrl = '/read.html?work=' + workId + '&section=' + sid;
      if (replaceState) {
        window.history.replaceState(null, '', newUrl);
      } else {
        window.history.pushState(null, '', newUrl);
      }

      sectionId = sid;
      setLastRead(workId, sid);

      // 加载章节内容（仅此一个 API 调用）
      var sectionData;
      try {
        sectionData = await api('/api/content/' + workId + '/sections/' + sid + '?mode=full');
      } catch (e) {}

      if (!sectionData || !sectionData.data) {
        document.getElementById('mid-content').innerHTML = '<div class="error">章节不存在</div>';
        return;
      }

      var section = sectionData.data;

      // 更新 DOM（不触碰布局和 Elf）
      document.title = section.title + ' — ' + _workTitle + ' — Cyber Art Universe';
      document.getElementById('bc-section').textContent = section.title;
      document.getElementById('mid-content').innerHTML = marked.parse(section.body || '（暂无正文内容）');

      // 左栏高亮 + prev/next + 信息
      renderLeftPanel(sid);
      if (_sections.length) renderPrevNext(_sections, sid);
      document.getElementById('chapter-info').innerHTML = ''
        + '<div class="info-row">' + (section.word_count || 0) + ' 字</div>'
        + (section.section_summary ? '<div class="info-row">' + escHtml(section.section_summary) + '</div>' : '')
        + (section.entities_involved && section.entities_involved.length ? '<div class="info-row">' + section.entities_involved.map(escHtml).join('、') + '</div>' : '');

      // 更新 Elf 上下文
      StoryElf.setContext({
        page: 'read',
        work_id: workId,
        work_title: _workTitle,
        section_id: sid,
        section_title: section.title,
      });
    }

    // 浏览器前进/后退
    window.addEventListener('popstate', function () {
      var params = new URLSearchParams(window.location.search);
      var sid = params.get('section');
      if (sid && sid !== sectionId) {
        loadChapter(sid, true);
      }
    });

    // ---- 初始化 ----

    if (!workId) {
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('mid-content').innerHTML = '<div class="error">缺少作品 ID</div>';
      });
    }

    document.addEventListener('DOMContentLoaded', async function () {
      if (!workId) return;

      // 如果没有指定章节 → 自动解析
      if (!sectionId) {
        sectionId = getLastRead(workId);
        if (!sectionId) {
          try {
            var outlineData = await api('/api/content/' + workId + '/outline');
            var sections = (outlineData && outlineData.data && outlineData.data.sections) || [];
            if (sections.length > 0) sectionId = sections[0].id;
          } catch (e) {}
        }
        if (sectionId) {
          window.location.replace('/read.html?work=' + workId + '&section=' + sectionId);
          return;
        }
        document.getElementById('mid-content').innerHTML = '<div class="error">该作品暂无章节</div>';
        return;
      }

      // 首次加载：初始化布局 + Elf + 作品元数据（只做一次）
      initReaderSplitView('split');

      var workData, outlineData;
      try {
        var results = await Promise.all([
          api('/api/content/' + workId),
          api('/api/content/' + workId + '/outline')
        ]);
        workData = results[0];
        outlineData = results[1];
      } catch (e) {}

      _workTitle = workData ? workData.data.title : workId;
      _sections = (outlineData && outlineData.data && outlineData.data.sections) ? outlineData.data.sections : [];

      document.getElementById('bc-work').textContent = _workTitle;
      StoryElf.setPage('read');

      // 加载首个章节（replaceState 避免多余的历史记录）
      loadChapter(sectionId, true);
    });
  </script>
</body>
</html>
