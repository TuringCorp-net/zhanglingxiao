<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>探索作品 — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <div id="global-nav"></div>

  <div class="container">
    <a href="/" class="back-link">← 返回</a>
    <div class="page-header"><h2>探索作品</h2></div>

    <div class="filter-bar">
      <select id="filter-category" onchange="loadWorks()">
        <option value="">全部题材</option>
        <option value="fantasy">奇幻·玄幻</option>
        <option value="science-fiction">科幻</option>
        <option value="romance">言情·恋爱</option>
        <option value="contemporary">都市·现实</option>
        <option value="adventure">动作·冒险</option>
        <option value="mystery-thriller">悬疑·惊悚</option>
        <option value="historical">历史·架空</option>
        <option value="young-adult">青春·成长</option>
      </select>
    </div>

    <div id="work-list" class="work-list"><div class="loading">加载中...</div></div>
    <div id="pagination" style="text-align:center;padding:2rem 0;"></div>
  </div>

  <footer class="footer">
    <div class="container">
      <span>Cyber Art Universe</span>
      <div><a href="/">首页</a></div>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
  <script>
    initPage('探索作品');
    let page = 1;

    document.addEventListener('DOMContentLoaded', () => {
      const cat = getParam('category');
      if (cat) document.getElementById('filter-category').value = cat;
      loadWorks();
    });

    async function loadWorks() {
      const cat = document.getElementById('filter-category').value;
      let path = `/api/catalog?type=novel&status=published&limit=20&page=${page}`;
      if (cat) path += `&category=${cat}`;

      const data = await api(path);
      const el = document.getElementById('work-list');
      if (!data || !data.data || data.data.length === 0) {
        el.innerHTML = '<div class="empty">暂无作品</div>';
        return;
      }
      el.innerHTML = data.data.map(renderWorkCard).join('');

      const total = data.meta?.total || 0;
      const totalPages = Math.ceil(total / 20);
      let pagHtml = '';
      if (page > 1) pagHtml += `<a href="#" onclick="changePage(${page-1});return false" class="btn btn-ghost">← 上一页</a> `;
      pagHtml += `<span style="color:var(--text-dim)">第 ${page} 页 / 共 ${totalPages} 页</span> `;
      if (page < totalPages) pagHtml += `<a href="#" onclick="changePage(${page+1});return false" class="btn btn-ghost">下一页 →</a>`;
      document.getElementById('pagination').innerHTML = pagHtml;
    }

    function changePage(p) { page = p; loadWorks(); window.scrollTo(0, 0); }
  </script>
</body>
</html>
