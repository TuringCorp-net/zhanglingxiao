<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .auth-container { max-width: 420px; margin: 120px auto 40px; padding: 0 20px; }
    .auth-card { background: var(--surface, #1a1a2e); border-radius: 12px; padding: 32px; border: 1px solid var(--border, #333); }
    .auth-title { font-size: 1.25rem; margin: 0 0 8px; color: var(--text, #e4e4e7); }
    .auth-title span { color: var(--accent, #7c3aed); }
    .auth-subtitle { font-size: 0.875rem; color: var(--text-dim, #71717a); margin: 0 0 24px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.875rem; color: var(--text-dim, #71717a); margin-bottom: 4px; }
    .form-group input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border, #333); background: var(--bg, #0f0f1a); color: var(--text, #e4e4e7); font-size: 1rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: var(--accent, #7c3aed); }
    .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-size: 1rem; cursor: pointer; font-weight: 600; }
    .btn-primary { background: var(--accent, #7c3aed); color: #fff; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; color: var(--accent, #7c3aed); border: 1px solid var(--accent, #7c3aed); margin-top: 8px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer { text-align: center; margin-top: 16px; font-size: 0.875rem; color: var(--text-dim, #71717a); }
    .auth-footer a { color: var(--accent, #7c3aed); text-decoration: none; }
    .msg { font-size: 0.875rem; margin-top: 16px; text-align: center; display: none; padding: 12px; border-radius: 8px; }
    .msg-info { background: rgba(124,58,237,0.08); color: var(--accent-light, #a78bfa); }
    .msg-error { background: rgba(239,68,68,0.08); color: var(--error, #ef4444); }
    .msg-success { background: rgba(34,197,94,0.08); color: var(--success, #22c55e); }
  </style>
</head>
<body data-page="connect">
  <div id="global-nav"></div>

  <div class="auth-container">
    <div class="auth-card" id="card">
      <!-- Step 1: 输入邮箱和密钥 -->
      <div id="step-input">
        <h1 class="auth-title">Cyber <span>Art</span> Universe</h1>
        <p class="auth-subtitle">Sign in or create an account — automatically routed.</p>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autofocus>
        </div>

        <div class="form-group">
          <label for="key">Key</label>
          <input type="password" id="key" placeholder="8–128 characters" minlength="8" maxlength="128" autocomplete="current-password">
        </div>

        <button class="btn btn-primary" id="btn-go" onclick="doConnect()">Continue</button>
        <div class="msg msg-error" id="msg-error"></div>
      </div>

      <!-- Step 2: 新用户确认 -->
      <div id="step-confirm" style="display:none">
        <h1 class="auth-title">New to Cyber <span>Art</span> Universe?</h1>
        <p class="auth-subtitle" id="confirm-msg"></p>

        <button class="btn btn-primary" id="btn-confirm" onclick="doConfirm()">Yes, create my account</button>
        <button class="btn btn-secondary" onclick="resetForm()">Go back</button>
        <div class="msg msg-error" id="msg-confirm-err"></div>
      </div>

      <!-- Step 3: 已完成（自动跳转） -->
      <div id="step-done" style="display:none">
        <h1 class="auth-title" id="done-title"></h1>
        <p class="auth-subtitle" id="done-msg"></p>
      </div>
    </div>

    <div class="auth-footer">
      <a href="/recover.html">Forgot your key?</a>
    </div>
  </div>

  <script src="/auth.js"></script>
  <script>
    let pendingEmail = '';
    let pendingKey = '';
    let pendingName = '';

    document.addEventListener('DOMContentLoaded', function() {
      CAU.updateLoginButton();
    });

    document.getElementById('key').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doConnect();
    });

    async function doConnect() {
      const email = document.getElementById('email').value.trim();
      const key = document.getElementById('key').value;
      const btn = document.getElementById('btn-go');
      const errEl = document.getElementById('msg-error');

      errEl.style.display = 'none';

      if (!email.includes('@')) { showErr('Please enter a valid email.'); return; }
      if (key.length < 8) { showErr('Key must be at least 8 characters.'); return; }

      btn.disabled = true;
      btn.textContent = 'Checking...';

      try {
        const resp = await fetch('/api/auth/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, key: key }),
        });
        const data = await resp.json();

        if (!resp.ok && resp.status !== 401) {
          // 429 rate limit or other errors
          showErr(data.error?.message || 'Something went wrong.');
          btn.disabled = false;
          btn.textContent = 'Continue';
          return;
        }

        if (data.ok) {
          const action = data.data.action;

          if (action === 'login') {
            CAU.setToken(data.data.token);
            CAU.setUser(data.data.user);
            CAU.updateLoginButton();
            showDone('Welcome back!', data.data.user.cyber_name);
            setTimeout(function() { location.href = '/'; }, 800);

          } else if (action === 'new_account') {
            pendingEmail = email;
            pendingKey = key;
            pendingName = data.data.suggested_cyber_name;
            document.getElementById('step-input').style.display = 'none';
            document.getElementById('step-confirm').style.display = 'block';
            document.getElementById('confirm-msg').textContent =
              'No account found for ' + email + '. Your Cyber Name will be « ' + pendingName + ' ». You can change it later in Settings.';
            btn.disabled = false;
            btn.textContent = 'Continue';

          } else if (action === 'registered') {
            CAU.setToken(data.data.token);
            CAU.setUser(data.data.user);
            CAU.updateLoginButton();
            showDone('Account created!', 'Check your email for the verification code.');
            setTimeout(function() { location.href = '/verify-email.html'; }, 1000);

          } else if (action === 'wrong_key') {
            showErr(data.data.message || 'Incorrect key. Please try again or recover your account.');
            btn.disabled = false;
            btn.textContent = 'Continue';
          }

        } else if (resp.status === 429) {
          showErr(data.error?.message || 'Too many attempts. Please wait.');
          btn.disabled = false;
          btn.textContent = 'Continue';
        }
      } catch (e) {
        showErr(e.message || 'Network error. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Continue';
      }
    }

    async function doConfirm() {
      const btn = document.getElementById('btn-confirm');
      const errEl = document.getElementById('msg-confirm-err');
      btn.disabled = true;
      btn.textContent = 'Creating...';
      errEl.style.display = 'none';

      try {
        const resp = await fetch('/api/auth/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: pendingEmail, key: pendingKey, confirm: true }),
        });
        const data = await resp.json();

        if (data.ok) {
          CAU.setToken(data.data.token);
          CAU.setUser(data.data.user);
          CAU.updateLoginButton();
          showDone('Account created!', 'Check your email for the verification code.');
          setTimeout(function() { location.href = '/verify-email.html'; }, 1000);
        } else {
          errEl.textContent = data.error?.message || 'Failed to create account.';
          errEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Yes, create my account';
        }
      } catch (e) {
        errEl.textContent = e.message || 'Network error.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Yes, create my account';
      }
    }

    function resetForm() {
      document.getElementById('step-input').style.display = 'block';
      document.getElementById('step-confirm').style.display = 'none';
      document.getElementById('msg-error').style.display = 'none';
    }

    function showErr(msg) {
      const el = document.getElementById('msg-error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showDone(title, msg) {
      document.getElementById('step-input').style.display = 'none';
      document.getElementById('step-confirm').style.display = 'none';
      document.getElementById('step-done').style.display = 'block';
      document.getElementById('done-title').textContent = title;
      document.getElementById('done-msg').textContent = msg;
    }
  </script>
</body>
</html>
