<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write — Story Forger — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="write">
  <div id="global-nav"></div>

  <!-- Pipeline 引导条 + 作品选择 -->
  <div class="pipeline-bar" id="pipeline-bar">
    <select id="workspace-selector" class="ws-select" onchange="onWorkspaceChange()">
      <option value="">选择作品...</option>
    </select>
    <div id="pipeline-guide" class="pipeline-guide" style="display:none">
      <div class="pipeline-steps" id="pipeline-steps"></div>
    </div>
  </div>

  <!-- 左右分栏写作区 -->
  <div id="split-view" class="split-view" style="display:none">
    <div class="split-left" id="split-left">
      <div class="left-panel-empty"></div>
    </div>
    <div class="split-divider" id="split-divider"></div>
    <div class="split-right">
      <div class="editor-header">
        <span class="editor-title" id="editor-title"></span>
        <div class="editor-actions" id="editor-actions">
          <button class="btn btn-ghost btn-sm" onclick="aiGenerateForModule()">AI 生成</button>
          <button class="btn btn-ghost btn-sm" onclick="aiPolishForModule()">润色</button>
          <button class="btn btn-primary btn-sm" onclick="saveModuleContent()">保存</button>
        </div>
      </div>
      <textarea id="writing-editor" class="writing-editor" placeholder="从这里开始写作..."></textarea>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <span>Powered by <a href="https://turingcorp.net">TuringCorp.net</a>. All rights reserved. <a href="#" onclick="alert('Terms of Use 即将上线');return false">Terms of Use</a></span>
      <a href="/.well-known/ai-manifest.json">AI Entry</a>
    </div>
  </footer>

  <!-- UI 模板 -->
  <template id="tmpl-loading"><div class="loading" style="padding:1rem;font-size:0.8rem">加载中...</div></template>
  <template id="tmpl-error"><div class="error" style="padding:1rem;font-size:0.8rem"><span class="err-msg"></span></div></template>
  <template id="tmpl-chat-msg-user"><div class="chat-msg chat-user"></div></template>
  <template id="tmpl-chat-msg-ai"><div class="chat-msg chat-ai"></div></template>
  <template id="tmpl-m0-hints">
    <div class="m0-hints">
      <p class="hint-item">记录你的灵感碎片——任何格式，任何内容。</p>
      <p class="hint-item">想想你喜欢的作品：它们的开头是怎样的？</p>
      <p class="hint-item">你想传达的核心情感是什么？</p>
      <p class="hint-item">有没有一个画面、一句对白或一个人物一直在你脑中？</p>
      <p class="hint-item">不要编辑自己——让想法自由流淌。</p>
    </div>
  </template>
  <template id="tmpl-entity-card-item">
    <div class="card-item" data-entity-id="">
      <span class="card-item-name"></span>
      <span class="card-item-meta"></span>
    </div>
  </template>
  <template id="tmpl-chapter-card-item">
    <div class="card-item chapter-card" data-section-id="" draggable="true">
      <span class="card-status"></span>
      <span class="card-item-name"></span>
      <span class="card-item-meta"></span>
    </div>
  </template>
  <template id="tmpl-fh-card-item">
    <div class="card-item fh-card" data-fh-id="">
      <span class="card-status"></span>
      <span class="card-item-name"></span>
      <span class="card-item-meta"></span>
    </div>
  </template>

  <script src="/assets/app.js"></script>
  <script src="/i18n-data.js"></script>
  <script src="/story-elf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/write-api.js"></script>
  <script src="/write.js"></script>
</body>
</html>
