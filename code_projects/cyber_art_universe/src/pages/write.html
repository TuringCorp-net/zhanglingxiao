<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write — Story Forger — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="write">
  <div id="global-nav"></div>

  <!-- 工具栏 -->
  <div class="sf-toolbar">
    <select id="workspace-selector" onchange="onWorkspaceChange()">
      <option value="">请先设置用户 Token...</option>
    </select>
    <input id="user-token-input" type="password" placeholder="用户 Token" onchange="setUserToken()">
    <label class="lang-selector" title="界面/生成语言">
      🌐 <select id="lang-select" onchange="onLangChange()">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </label>
    <label class="bilingual-check" id="bilingual-label" title="默认同时生成中英双语版本（AI 成本 ×2）">
      <input type="checkbox" id="bilingual-checkbox" checked onchange="onBilingualChange()"> 双语生成
    </label>
    <div id="work-actions" style="display:flex;gap:0.4rem"></div>
  </div>

  <!-- 写作引导流程 -->
  <div id="pipeline-guide" class="pipeline-guide" style="display:none">
    <div class="pipeline-steps" id="pipeline-steps"></div>
  </div>

  <!-- 写作桌（唯一界面） -->
  <div id="writing-desk" class="writing-desk">

      <!-- 左活页夹 -->
      <aside id="left-binder" class="binder-panel binder-left">
        <div class="binder-resize-handle"></div>
        <div class="binder-collapse-btn" onclick="toggleBinder('left')" title="折叠/展开">◀</div>
        <div class="binder-icon-bar">
          <span title="总纲">📖</span><span title="世界观">🌍</span><span title="人物">👤</span><span title="章节">📑</span><span title="伏笔">🎯</span>
        </div>
        <div class="binder-sections">
          <div class="binder-section" data-section="synopsis">
            <div class="binder-section-header open" onclick="toggleBinderSection('synopsis')">
              📖 总纲 <span class="binder-arrow">▶</span>
            </div>
            <div class="binder-section-body open"></div>
          </div>
          <div class="binder-section" data-section="worldbuilding">
            <div class="binder-section-header" onclick="toggleBinderSection('worldbuilding')">
              🌍 世界观 <span class="binder-arrow">▶</span>
            </div>
            <div class="binder-section-body"></div>
          </div>
          <div class="binder-section" data-section="characters">
            <div class="binder-section-header" onclick="toggleBinderSection('characters')">
              👤 人物树 <span class="binder-arrow">▶</span>
            </div>
            <div class="binder-section-body"></div>
          </div>
          <div class="binder-section" data-section="chapters">
            <div class="binder-section-header open" onclick="toggleBinderSection('chapters')">
              📑 章节树 <span class="binder-arrow">▶</span>
            </div>
            <div class="chapter-filters" id="chapter-filters" style="display:none">
              <button class="chapter-filter-btn active" data-filter="all">全部</button>
              <button class="chapter-filter-btn" data-filter="draft">✍️ 写作中</button>
              <button class="chapter-filter-btn" data-filter="done">✅ 已完成</button>
            </div>
            <div class="binder-section-body open" id="chapter-tree"></div>
          </div>
          <div class="binder-section" data-section="foreshadowing">
            <div class="binder-section-header" onclick="toggleBinderSection('foreshadowing')">
              🎯 伏笔账本 <span class="binder-arrow">▶</span>
            </div>
            <div class="binder-section-body" id="foreshadowing-list"></div>
          </div>
        </div>
      </aside>

      <!-- 中写作区 -->
      <main class="writing-area">
        <div class="writing-header">
          <span class="writing-header-title" id="writing-section-title">选择左侧章节开始写作</span>
          <div class="writing-header-actions">
            <button class="preview-toggle-btn" onclick="togglePreview()" title="切换编辑/预览">👁 预览</button>
            <button class="btn btn-ghost btn-sm" onclick="aiGenerateForSection()" style="padding:0.3rem 0.75rem;font-size:0.8rem">🤖 AI 生成</button>
            <button class="btn btn-ghost btn-sm" onclick="aiPolishSection()" style="padding:0.3rem 0.75rem;font-size:0.8rem">✨ 润色</button>
            <button class="btn btn-primary btn-sm" onclick="saveCurrentSection()" style="padding:0.3rem 0.75rem;font-size:0.8rem">💾 保存</button>
          </div>
        </div>
        <div class="writing-split" id="writing-split">
          <textarea id="writing-editor" class="writing-editor" placeholder="在这里写你的故事...&#10;&#10;选择左侧章节树中的章节开始写作，或点击「AI 生成」让 AI 帮你写初稿。"></textarea>
          <div id="writing-preview" class="writing-preview"><div class="empty">预览将在此显示</div></div>
        </div>
      </main>

      <!-- 右活页夹 -->
      <aside id="right-binder" class="binder-panel binder-right">
        <div class="binder-resize-handle"></div>
        <div class="binder-collapse-btn" onclick="toggleBinder('right')" title="折叠/展开">▶</div>
        <div class="binder-icon-bar">
          <span title="信息">📋</span><span title="检查">⚠</span><span title="建议">💡</span><span title="对话">🤖</span>
        </div>
        <div class="binder-tabs">
          <button class="binder-tab active" data-tab="info" onclick="switchRightTab('info')">📋 信息</button>
          <button class="binder-tab" data-tab="lint" onclick="switchRightTab('lint')">⚠ 检查</button>
          <button class="binder-tab" data-tab="suggest" onclick="switchRightTab('suggest')">💡 建议</button>
          <button class="binder-tab" data-tab="chat" onclick="switchRightTab('chat')">🤖 对话</button>
        </div>
        <div class="binder-tab-content" id="tab-info"><div class="empty">选择章节查看信息</div></div>
        <div class="binder-tab-content" id="tab-lint" style="display:none"><div class="empty">选择章节后运行检查</div></div>
        <div class="binder-tab-content" id="tab-suggest" style="display:none"><div class="empty">AI 建议即将推出</div></div>
        <div class="binder-tab-content" id="tab-chat" style="display:none">
          <div id="chat-messages" class="chat-messages"></div>
          <div class="chat-input-row">
            <input id="chat-input" placeholder="让 AI 帮你修改这段..." onkeydown="if(event.key==='Enter')sendChat()">
            <button class="btn btn-primary btn-sm" onclick="sendChat()" style="padding:0.35rem 0.75rem;font-size:0.75rem">发送</button>
          </div>
        </div>
      </aside>
  </div>

  <footer class="footer">
    <div class="container">
      <span>Story Forger · Powered by <a href="https://turingcorp.net">TuringCorp.net</a>. All rights reserved. <a href="#" onclick="alert('Terms of Use 即将上线');return false">Terms of Use</a></span>
      <a href="/.well-known/ai-manifest.json">AI Entry</a>
    </div>
  </footer>

  <script src="/assets/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/write.js"></script>
</body>
</html>
