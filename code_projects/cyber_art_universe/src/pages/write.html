<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Write — Story Forger — Cyber Art Universe</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/story-elf.css">
</head>
<body data-page="write">
  <div id="global-nav"></div>

  <!-- Pipeline 引导条 + 作品选择 -->
  <div class="pipeline-bar" id="pipeline-bar">
    <button id="workspace-btn" class="ws-btn" onclick="openWorkspaceModal()" data-i18n="label.select_work">选择作品...</button>
    <div id="pipeline-guide" class="pipeline-guide" style="display:none">
      <div class="pipeline-steps" id="pipeline-steps"></div>
    </div>
  </div>

  <!-- 作品集浮出层 -->
  <div id="workspace-overlay" class="ws-overlay" style="display:none" onclick="closeWorkspaceModal(event)">
    <div class="ws-modal" onclick="event.stopPropagation()">
      <div class="ws-modal-header">
        <h2 class="ws-modal-title" data-i18n="ws.collection">作品集</h2>
        <button class="ws-add-btn" onclick="showNewWorkInput()" data-i18n-title="ws.new_work" title="新增作品">+</button>
      </div>
      <div id="ws-new-work-row" class="ws-new-work-row" style="display:none">
        <input id="ws-new-work-input" class="ws-new-work-input" data-i18n-placeholder="ws.name_placeholder" placeholder="输入作品名称..." maxlength="80"
          onkeydown="if(event.key==='Enter')createNewWork()">
        <button class="ws-new-work-confirm" onclick="createNewWork()" data-i18n="action.confirm">确认</button>
        <button class="ws-new-work-cancel" onclick="cancelNewWork()" data-i18n="action.cancel">取消</button>
      </div>
      <div id="ws-card-grid" class="ws-card-grid">
        <div class="loading" style="padding:2rem;text-align:center;color:var(--text-muted)">加载中...</div>
      </div>

      <!-- 作品卡片右键菜单 -->
      <div id="ws-card-menu" class="ws-card-menu" style="display:none" onclick="event.stopPropagation()">
        <div id="ws-card-menu-items"></div>
        <div id="ws-card-menu-edit" style="display:none">
          <input id="ws-card-menu-edit-input" class="ws-card-menu-edit-input" maxlength="80"
            onkeydown="if(event.key==='Enter')confirmEditTitle()">
          <div class="ws-card-menu-edit-actions">
            <button class="ws-card-menu-btn-confirm" onclick="confirmEditTitle()" data-i18n="action.confirm">确认</button>
            <button class="ws-card-menu-btn-cancel" onclick="cancelEditTitle()" data-i18n="action.cancel">取消</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
   Layer 0: 主编辑画布（全宽，始终固定不动）
   ============================================================ -->
  <div id="main-canvas" class="main-canvas" style="display:none">
    <textarea id="writing-editor" class="writing-editor" placeholder="从这里开始写作..."></textarea>
    <div id="slot-free-zone" class="slot-free-zone" style="display:none">
      <div class="slot-free-label">自由编辑区</div>
      <textarea id="slot-free-area" class="writing-editor free-zone"
        placeholder="随意书写，Story Elf 会帮你完善和拆解到模板中…"
        data-hint="请随意书写，我可以帮你完善和拆解到模板中去。"></textarea>
    </div>
  </div>

  <!-- ============================================================
   Layer 1: AI Chat 左侧 Drawer（默认展开，可收起到头像）
   ============================================================ -->
  <div id="ai-drawer" class="ai-drawer open">
    <button id="ai-drawer-toggle" class="ai-drawer-toggle" title="Story Elf">
      <img src="/assets/story-elf.png" alt="Story Elf" class="ai-drawer-toggle-img">
    </button>
    <div id="ai-drawer-panel" class="ai-drawer-panel"></div>
  </div>

  <!-- ============================================================
   Layer 2: 知识库系统（右侧浮动标签 + 二级面板 + 内容 Drawer）
   ============================================================ -->
  <!-- 右侧浮动标签栏 -->
  <div id="kb-tab-bar" class="kb-tab-bar" style="display:none"></div>

  <!-- 二级标签栏（浮动在一级标签左侧） -->
  <div id="kb-l2-tab-bar" class="kb-l2-tab-bar" style="display:none"></div>

  <!-- 内容 Drawer（70% 宽，覆盖式） -->
  <div id="kb-content-drawer" class="kb-content-drawer" style="display:none">
    <div class="kb-drawer-header">
      <span id="kb-drawer-title" class="kb-drawer-title"></span>
      <button class="kb-drawer-close" onclick="closeKBContentDrawer()">&times;</button>
    </div>
    <div id="kb-drawer-content" class="kb-drawer-content">
      <div id="slot-editor" class="slot-editor" style="display:none">
        <div id="slot-groups" class="slot-groups"></div>
      </div>
      <div id="kb-card-list-view" class="kb-card-list-view" style="display:none"></div>
      <div id="form-editor" class="form-editor" style="display:none">
        <div id="form-fields"></div>
        <button id="form-save-btn" class="btn btn-primary btn-sm" style="margin:0.5rem;">保存意图卡</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <span>Powered by <a href="https://turingcorp.net">TuringCorp.net</a>. All rights reserved. <a href="#" onclick="alert('Terms of Use 即将上线');return false">Terms of Use</a></span>
      <a href="/.well-known/agent-manifest.json">Agent Entry</a>
    </div>
  </footer>

  <!-- UI 模板 -->
  <template id="tmpl-loading"><div class="loading" style="padding:1rem;font-size:0.8rem">加载中...</div></template>
  <template id="tmpl-error"><div class="error" style="padding:1rem;font-size:0.8rem"><span class="err-msg"></span></div></template>
  <template id="tmpl-chat-msg-user"><div class="chat-msg chat-user"></div></template>
  <template id="tmpl-chat-msg-ai"><div class="chat-msg chat-ai"></div></template>
  <template id="tmpl-entity-card-item">
    <div class="card-item" data-entity-id="">
      <span class="card-item-name"></span>
      <span class="card-item-meta"></span>
    </div>
  </template>
  <template id="tmpl-chapter-card-item">
    <div class="card-item chapter-card" data-section-id="" draggable="true">
      <span class="card-status"></span>
      <span class="card-item-name"></span>
      <span class="card-item-meta"></span>
    </div>
  </template>
  <script src="/assets/app.js"></script>
  <script src="/i18n-data.js"></script>
  <script src="/auth.js"></script>
  <script src="/story-elf.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/write-api.js"></script>
  <script src="/write.js"></script>
</body>
</html>
