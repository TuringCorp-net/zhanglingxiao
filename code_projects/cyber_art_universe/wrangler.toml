name = "cyber_art_api"
main = "src/api/index.ts"
compatibility_date = "2024-12-05"
account_id = "21303cf88c8c1cc2c97d78eabda103a2"

routes = [
  { pattern = "CAU.turingcorp.net", custom_domain = true }
]

# Cron 定时任务：每天凌晨 3:00 执行记忆提取（"睡眠"）
[triggers]
crons = ["0 19 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "cyber_art_db"
database_id = "619a8b4f-fc5c-44f8-9035-4e7200f1ab15"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "WORKS_BUCKET"
bucket_name = "cyber-art-works"

[[services]]
binding = "SELF"
service = "cyber_art_api"

[assets]
directory = "src/pages"

[vars]
# CF_AIG_TOKEN is managed via Cloudflare Dashboard Secrets (AI Gateway 认证，详见 docs/story_elf/cloudflare_ai_gateway_guide.md)
# AI_PROVIDER / AI_API_KEY 已废弃（迁移到 AI Gateway + BYOK），待所有调用方迁移完成后可删除

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# .md 文件作为文本导入（用于 L1 prompt 模板）
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true
